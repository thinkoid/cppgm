name: Clang build

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      build_run_id:
        type: string
        default: ''
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: clang-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clang:
    name: Clang built by cppgm at -O3
    concurrency:
      group: hosted-benchmark-builds
      queue: max
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      CXX: g++
      CPPGM_HOST_CXX: g++
      CPPGM_STDLIB_FLAGS: ""
      CPPGM_WARNINGS_AS_ERRORS: "1"
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential binutils ca-certificates cmake git ninja-build python3
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Trust the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore or build compiler
        uses: ./.github/actions/benchmark-compiler
        with:
          build-run-id: ${{ inputs.build_run_id }}
      - name: Build pinned Clang with cppgm and run the built compiler
        run: python3 scripts/llvm_ci.py run --output obj/llvm
      - name: Report
        if: always()
        run: |
          if [ -f obj/llvm/summary.md ]; then
            cat obj/llvm/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain results and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llvm-${{ inputs.source_sha || github.sha }}-${{ github.run_id }}
          path: |
            obj/llvm/*.json
            obj/llvm/*.md
            obj/llvm/*.log
          if-no-files-found: warn
          retention-days: 14
